  <main class="container">
    <section>
      <h2 style="margin-bottom:16px;">المنشورات المنشورة اليوم</h2>

      <div id="loading" class="loading">
        ⏳ جاري تحميل منشورات اليوم...

  <script>
    function shortText(text, max = 180) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();
      if (clean.length <= max) return clean;
      return clean.slice(0, max) + "...";
    }

    async function loadTodayPosts() {
      const box = document.getElementById("today-list");
      const loading = document.getElementById("loading");
      if (!box) {
        console.error("العنصر today-list غير موجود");
        return;
      }

      try {
        const res = await fetch("/api/news?limit=300", {
          headers: {
            "x-api-key": "linkgaza_secret_2026"
          }
        });

        if (!res.ok) {
          throw new Error("فشل جلب الأخبار");
        }

        const json = await res.json();
        const items = json?.data?.items || json?.data || [];

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const todayPosts = items.filter(item => {
          const created = new Date(item.created_at);
          created.setHours(0, 0, 0, 0);
          return created.getTime() === today.getTime();
        });

        box.innerHTML = "";

        if (!todayPosts.length) {
          box.innerHTML = 
            `<div class="card">
              <h3>لا توجد منشورات منشورة اليوم</h3>
              <div class="summary">
                سيتم عرض كل ما نُشر اليوم هنا فور إضافة منشورات جديدة بتاريخ اليوم.
              </div>
            </div>`
          ;
          if (loading) loading.style.display = "none";
          return;
        }

        todayPosts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        todayPosts.forEach(post => {
          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = 
            `<h3>${post.title || ""}</h3>
            <div class="summary">${shortText(post.summary || "", 180)}</div>
            <div class="meta">🕒 تاريخ النشر: ${post.created_at ? new Date(post.created_at).toLocaleString("ar-PS") : ""}</div>
            <a class="btn" href="/g/${post.slug}">قراءة المزيد .....</a>`
          ;

          box.appendChild(card);
        });

        if (loading) loading.style.display = "none";

      } catch (err) {
        console.error(err);

        box.innerHTML = 
          `<div class="card">
            <h3>⚠️ فشل تحميل منشورات اليوم</h3>
            <div class="summary">${err.message}</div>
          </div>`
        ;

        if (loading) loading.style.display = "none";
      }
    }

    (function () {
      const menuBtn = document.getElementById("menuBtn");
      const navLinks = document.getElementById("navLinks");
      if (!menuBtn || !navLinks) return;

      menuBtn.addEventListener("click", () => {
        navLinks.classList.toggle("active");
        menuBtn.classList.toggle("active");
      });
    })();

    document.addEventListener("DOMContentLoaded", loadTodayPosts);
  </script>

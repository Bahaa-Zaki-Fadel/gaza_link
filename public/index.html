<audio id="salatAudio" preload="auto">
  <source src="/audio/salad.ogg" type="audio/ogg">
</audio>

<script>
  const audio = document.getElementById("salatAudio");
  let played = false;

  async function playSalatOnce() {
    if (played) return;
    played = true;

    try {
      audio.volume = 1.0;
      audio.currentTime = 0;
      await audio.play();
    } catch (e) {
      played = false;
      return;
    }

    window.removeEventListener("touchstart", playSalatOnce);
    window.removeEventListener("click", playSalatOnce);
    window.removeEventListener("scroll", playSalatOnce);
  }

  window.addEventListener("touchstart", playSalatOnce, { passive: true });
  window.addEventListener("click", playSalatOnce);
  window.addEventListener("scroll", playSalatOnce, { passive: true });
</script>
